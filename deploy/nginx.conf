# nginx site config for the WhatsApp backend.
#
# Install on the VPS as:
#   /etc/nginx/sites-available/wa-backend
# then:
#   ln -s /etc/nginx/sites-available/wa-backend /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace api.example.com with your real domain before use.
# Run certbot AFTER the HTTP block below is live:
#   certbot --nginx -d api.example.com

# Map lets us pass the Upgrade header through only when present.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Certbot writes its ACME challenge here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else goes to HTTPS. Certbot usually adds this for you.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # Certbot fills these in. Paths shown for reference.
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Media uploads are sent as base64 JSON, and the app allows up to 50mb
    # payloads, so nginx must not reject them first.
    client_max_body_size 60m;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Socket.IO (WebSocket) ----
    # This block must come before //api so the upgrade headers are applied.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for the WebSocket handshake.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections: don't cut the socket while it is idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Nothing else is served from this host. The frontend lives on Vercel.
    location / {
        return 404;
    }
}
