# nginx site config — frontend AND API from one origin on this VPS.
#
# Use this instead of nginx.conf when the Node process also serves the built
# frontend from dist/ (no Vercel). Everything goes to 127.0.0.1:5000: static
# assets, /api, and /socket.io are all handled by the same Express process, so
# there is one place that owns caching and routing.
#
# Install:
#   sudo cp deploy/nginx-single-origin.conf /etc/nginx/sites-available/wa-app
#   sudo nano /etc/nginx/sites-available/wa-app        # set your domain
#   sudo ln -s /etc/nginx/sites-available/wa-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (this rewrites the file to add the TLS block):
#   sudo certbot --nginx -d omnireach.my.id -d www.omnireach.my.id
#
# IMPORTANT on a shared server:
#   - Do NOT remove or edit other files in sites-enabled/.
#   - Do NOT run `rm /etc/nginx/sites-enabled/default` as the older DEPLOY.md
#     suggests; other sites on this box may depend on what is already there.
#   - The map variable below is deliberately named $wa_connection_upgrade rather
#     than the conventional $connection_upgrade. Two site configs that both
#     define the same map name make nginx fail to start with "duplicate map
#     parameter", which would take every site on this server down.

map $http_upgrade $wa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name omnireach.my.id www.omnireach.my.id;

    # Certbot writes its ACME challenge here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # certbot --nginx normally adds this redirect itself. Harmless to keep.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name omnireach.my.id www.omnireach.my.id;

    # certbot fills these in when it runs. Paths shown for reference.
    # ssl_certificate     /etc/letsencrypt/live/omnireach.my.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/omnireach.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Media is posted as base64 JSON and the app accepts up to 50mb bodies, so
    # nginx must not reject the request before Express sees it.
    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compress text responses. The JS bundle is ~1 MB raw, ~280 kB gzipped.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Socket.IO (WebSocket) ----
    # Must come before /api/ and / so the upgrade headers are applied.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wa_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections must not be cut while idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---- Frontend ----
    # Express serves dist/ with the correct cache headers already: index.html
    # and SPA deep links are no-cache, /assets/* are immutable for a year.
    # Passing them through keeps one owner for that policy.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # Optional optimisation: let nginx serve the static files directly instead of
    # proxying them, which skips Node for every asset request. Replace the
    # `location /` block above with this, and set the path to your checkout.
    #
    #   root /root/wa-backend/dist;
    #   index index.html;
    #
    #   location / {
    #       try_files $uri $uri/ /index.html;
    #   }
    #
    #   location /assets/ {
    #       expires 1y;
    #       add_header Cache-Control "public, immutable";
    #   }
    #
    # Note: nginx (user www-data) must be able to read the path, which means the
    # parent directories need o+x. That is why proxying is the default here — it
    # avoids permission surprises when the checkout lives under /root.
}
