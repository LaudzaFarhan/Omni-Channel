# nginx site config — frontend AND API from one origin on this VPS.
#
# Use this instead of nginx.conf when the Node process also serves the built
# frontend from dist/ (no Vercel). Everything goes to 127.0.0.1:5000: static
# assets, /api and /socket.io are all handled by the same Express process, so
# there is one place that owns caching and routing.
#
# ---------------------------------------------------------------------------
# THIS FILE IS HTTP-ONLY ON PURPOSE. Do not add a `listen 443 ssl` block by hand.
# ---------------------------------------------------------------------------
# nginx refuses to start if a `listen ... ssl` directive exists without an
# ssl_certificate, but certbot cannot issue that certificate until `nginx -t`
# passes. Hand-writing the TLS block therefore deadlocks.
#
# Instead, install this as-is and let certbot convert it: given a single port-80
# vhost, `certbot --nginx` adds `listen 443 ssl` plus the certificate paths to
# this same block and generates a separate HTTP-to-HTTPS redirect block. Every
# proxy setting below is preserved.
#
# Install:
#   sudo cp deploy/nginx-single-origin.conf /etc/nginx/sites-available/wa-app
#   sudo nano /etc/nginx/sites-available/wa-app        # set server_name
#   sudo ln -s /etc/nginx/sites-available/wa-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Point DNS at this server and confirm it resolves, then:
#   dig +short your.domain          # must return this server's IP
#   sudo certbot --nginx -d your.domain
#
# Answer "redirect" when certbot asks, so HTTP traffic is forced to HTTPS.
#
# IMPORTANT on a shared server:
#   - Do NOT remove or edit other files in sites-enabled/.
#   - Do NOT run `rm /etc/nginx/sites-enabled/default` as the older DEPLOY.md
#     suggests; other sites on this box may depend on what is already there.
#   - Always `nginx -t` before reloading. A broken config refuses to load, which
#     protects the running sites, but never reload blind.
#   - The map variable is deliberately named $wa_connection_upgrade rather than
#     the conventional $connection_upgrade. Two site configs defining the same
#     map name make nginx fail to start with "duplicate map parameter", which
#     would take every site on this server down.
#   - HTTP/2 is optional and its directive is version-dependent, so it is left
#     out. To enable after certbot has run:
#       nginx >= 1.25.1:  add `http2 on;` to the server block
#       nginx <  1.25.1:  append http2 to the listen line (listen 443 ssl http2;)
#     Check your build with `nginx -v`.

map $http_upgrade $wa_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # Set this to your hostname before enabling the site.
    server_name omnireach.my.id www.omnireach.my.id;

    # Certbot writes its ACME challenge here during validation.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Media is posted as base64 JSON and the app accepts up to 50mb bodies, so
    # nginx must not reject the request before Express sees it.
    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ignored by browsers over plain HTTP; takes effect once certbot has added
    # the TLS listener to this block.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compress text responses. The JS bundle is ~1 MB raw, ~280 kB gzipped.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Socket.IO (WebSocket) ----
    # Must come before /api/ and / so the upgrade headers are applied.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wa_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections must not be cut while idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---- Frontend ----
    # Express serves dist/ with the correct cache headers already: index.html
    # and SPA deep links are no-cache, /assets/* are immutable for a year.
    # Proxying keeps a single owner for that policy.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # Optional optimisation: let nginx serve the static files directly instead of
    # proxying them, which skips Node for every asset request. Replace the
    # `location /` block above with this, and set the path to your checkout.
    #
    #   root /root/wa-backend/dist;
    #   index index.html;
    #
    #   location / {
    #       try_files $uri $uri/ /index.html;
    #   }
    #
    #   location /assets/ {
    #       expires 1y;
    #       add_header Cache-Control "public, immutable";
    #   }
    #
    # Note: nginx (user www-data) must be able to read the path, which means the
    # parent directories need o+x. That is why proxying is the default here — it
    # avoids permission surprises when the checkout lives under /root.
}
