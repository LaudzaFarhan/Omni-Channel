    fill-rule="evenodd"
    d="M39 8h43c10 0 16 8 14 19L85 76c-2-8-8-13-18-13H39C20 63 8 52 11 36 14 19 25 8 39 8Zm3 17c-8 0-14 5-16 13-2 8 3 13 13 13h34l6-26H42Z"
