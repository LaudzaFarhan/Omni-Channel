<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Omni Reach">
  <defs>
    <linearGradient id="omniBlue" x1="0.08" y1="0.1" x2="0.92" y2="0.92">
      <stop offset="0" stop-color="#4f7df0"/>
      <stop offset="1" stop-color="#3155bd"/>
    </linearGradient>
    <linearGradient id="omniFold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#28499f"/>
      <stop offset="1" stop-color="#17377f"/>
    </linearGradient>
  </defs>
  <!-- The supplied mark is a folded ribbon, not a chat bubble. The even-odd cutout
