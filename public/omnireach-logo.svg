  <path d="M67 63h2c10 0 16 5 16 13-1 9-7 15-18 17l-15 2 4-32h11Z" fill="url(#omniFold)"/>
  <path d="M56 63h11c9 0 15 4 17 11-4-4-10-6-17-6H55l1-5Z" fill="#244aa4" opacity="0.78"/>
  <!-- Navy aperture from the supplied logo. -->
  <circle cx="50" cy="38" r="8" fill="#ffffff" stroke="#11285f" stroke-width="6"/>
</svg>
